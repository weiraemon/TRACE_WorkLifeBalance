name: ATLAS R0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      ATLAS_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Business and adapter dependency boundaries
        run: npm run check:architecture
      - name: Unit and integration tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          path: test-results
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Match the version tag to package.json
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne $expected) { throw "Tag must match package.json: $expected" }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Package Windows desktop
        shell: pwsh
        run: |
          npm run package:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Path 'releases/CHAOS-desktop-*' -Directory)
          if ($packages.Count -ne 1) { throw 'Expected exactly one completed desktop package' }
          "CHAOS_RELEASE_DIRECTORY=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify the actual release ZIP
        shell: pwsh
        run: npm run test:release -- (Join-Path $env:CHAOS_RELEASE_DIRECTORY 'CHAOS-Windows-x64.zip')
      - name: Publish the ZIP and checksum to the version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:CHAOS_RELEASE_DIRECTORY 'CHAOS-Windows-x64.zip'
          $checksums = Join-Path $env:CHAOS_RELEASE_DIRECTORY 'SHA256SUMS.txt'
          gh release create $env:RELEASE_TAG $archive $checksums --verify-tag --generate-notes --title "CHAOS $env:RELEASE_TAG" --repo $env:GITHUB_REPOSITORY
